[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-edge-caching"
version = "0.1.0"
description = "Adaptive Edge Caching with Multi-Metric Eviction and Dynamic Routing"
authors = [
    { name = "Immanuel G" },
    { name = "Saumya Shekhar" },
    { name = "Riddhi Bhaduri" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.28.0",
    "psutil>=5.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
