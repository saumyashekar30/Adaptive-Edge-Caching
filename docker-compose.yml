version: '3.8'

services:
  origin:
    build:
      context: .
      dockerfile: docker/Dockerfile.origin
    container_name: edge-origin
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - LATENCY_MS=60

  node1:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
    container_name: edge-node-1
    ports:
      - "8081:8080"
    environment:
      - NODE_ID=node1
      - ORIGIN_URL=http://origin:8000
    depends_on:
      - origin

  node2:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
    container_name: edge-node-2
    ports:
      - "8082:8080"
    environment:
      - NODE_ID=node2
      - ORIGIN_URL=http://origin:8000
    depends_on:
      - origin

  node3:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
    container_name: edge-node-3
    ports:
      - "8083:8080"
    environment:
      - NODE_ID=node3
      - ORIGIN_URL=http://origin:8000
    depends_on:
      - origin
