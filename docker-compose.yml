version: '3.8'

services:
  origin:
    build:
      context: .
      dockerfile: docker/Dockerfile.origin
    ports:
      - "9000:9000"
    environment:
      - PORT=9000

  controller:
    build:
      context: .
      dockerfile: docker/Dockerfile.controller
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    depends_on:
      - origin

  node1:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
    ports:
      - "8001:8001"
    environment:
      - CONFIG_FILE=config/nodes/node1.yaml
    depends_on:
      - controller
      - origin

  node2:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
    ports:
      - "8002:8002"
    environment:
      - CONFIG_FILE=config/nodes/node2.yaml
    depends_on:
      - controller
      - origin

  node3:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
    ports:
      - "8003:8003"
    environment:
      - CONFIG_FILE=config/nodes/node3.yaml
    depends_on:
      - controller
      - origin
