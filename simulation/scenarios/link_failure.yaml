scenario_name: "link_failure"
description: "Simulates sudden physical link disconnection to Node 2 at T=15s and link recovery at T=35s"

topology:
  nodes:
    controller: { ip: "10.0.0.1", port: 8000 }
    edge_node_1: { ip: "10.0.1.10", port: 8081, bandwidth_mbps: 100, delay_ms: 10.0, loss_pct: 0.0 }
    edge_node_2: { ip: "10.0.2.10", port: 8082, bandwidth_mbps: 100, delay_ms: 10.0, loss_pct: 0.0 }
    edge_node_3: { ip: "10.0.3.10", port: 8083, bandwidth_mbps: 100, delay_ms: 12.0, loss_pct: 0.0 }
    origin: { ip: "10.0.100.1", port: 8000, latency_ms: 60.0 }

events:
  - { type: "link_down", target: "edge_node_2", timestamp_s: 15.0 }
  - { type: "link_up", target: "edge_node_2", timestamp_s: 35.0 }

routing_weights:
  alpha: 0.40
  beta: 0.30
  gamma: 0.20
  delta: 0.10

workload:
  duration_seconds: 60
  request_rate_rps: 100
