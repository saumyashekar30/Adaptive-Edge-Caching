scenario_name: "packet_loss"
description: "Simulates wireless/lossy channel on Node 2 using ns3::RateErrorModel with 8% packet drop rate"

topology:
  nodes:
    controller: { ip: "10.0.0.1", port: 8000 }
    edge_node_1: { ip: "10.0.1.10", port: 8081, bandwidth_mbps: 100, delay_ms: 10.0, loss_pct: 0.1 }
    edge_node_2: { ip: "10.0.2.10", port: 8082, bandwidth_mbps: 100, delay_ms: 15.0, loss_pct: 8.5 }  # High loss link
    edge_node_3: { ip: "10.0.3.10", port: 8083, bandwidth_mbps: 100, delay_ms: 20.0, loss_pct: 0.2 }
    origin: { ip: "10.0.100.1", port: 8000, latency_ms: 60.0 }

routing_weights:
  alpha: 0.30
  beta: 0.50   # Packet loss heavily penalized
  gamma: 0.10
  delta: 0.10

workload:
  duration_seconds: 60
  request_rate_rps: 100
  cache_hit_ratio_expected: 0.78
