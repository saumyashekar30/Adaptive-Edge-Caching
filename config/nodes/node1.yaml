id: "node1"
host: "127.0.0.1"
port: 8081
capacity_mb: 50
max_object_size_mb: 5
policy: "adaptive"
origin_url: "http://127.0.0.1:8000"
peers:
  - "http://127.0.0.1:8082"
  - "http://127.0.0.1:8083"
# Optional: routing controller to push telemetry to (src/routing/controller.py).
# Leave unset to run node1 standalone without a controller.
controller_url: "http://127.0.0.1:9000"
telemetry_interval_seconds: 5
